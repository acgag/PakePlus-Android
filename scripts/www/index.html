        .modal-icon { font-size:50px; margin-bottom:15px; }

        .btn-reject { background:#f5f5f5; color:#999; border:2px solid #eee; }

        .plus-one { position:fixed; pointer-events:none; z-index:9999; font-size:24px; font-weight:bold; color:#e91e63; font-family:"Courier New",monospace; text-shadow:0 2px 4px rgba(233,30,99,0.3); animation:floatUp 0.8s ease-out forwards; }

    // ===== 🎵 纯代码合成音乐引擎 =====
    const MusicEngine = (() => {
        let ctx = null;
        let bgmNodes = [];
        let isPlaying = false;
        const init = () => { 
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (ctx.state === 'suspended') ctx.resume();
        };
        const createNote = (freq, type, startTime, duration, vol = 0.08) => {
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(vol, startTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain).connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
            return { osc, gain };
        };
        const playBGM = () => {
            init();
            if (!ctx || isPlaying) return;
            isPlaying = true;
            const melody = [523.25, 659.25, 783.99, 659.25, 523.25, 783.99, 659.25, 523.25, 587.33, 698.46, 880.00, 698.46, 587.33, 880.00, 698.46, 587.33];
            const noteDur = 0.35;
            const loopDur = melody.length * noteDur;
            const scheduleLoop = () => {
                if (!isPlaying || !ctx) return;
                const now = ctx.currentTime + 0.1;
                melody.forEach((freq, i) => {
                    const node = createNote(freq, 'sine', now + i * noteDur, noteDur * 0.9, 0.06);
                    if (node) bgmNodes.push(node);
                });
                setTimeout(scheduleLoop, loopDur * 1000 - 200);
            };
            scheduleLoop();
        };
        const stopBGM = () => {
            isPlaying = false;
            bgmNodes.forEach(n => { try { n.osc.stop(); } catch(e){} });
            bgmNodes = [];
        };
        const playPoke = () => { init(); if (!ctx) return; createNote(1320, 'sine', ctx.currentTime, 0.12, 0.8); };
        const playReject = () => {
            init(); if (!ctx) return;
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.9, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3);
        };
        const playSuccess = () => {
            init(); if (!ctx) return;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { createNote(freq, 'sine', ctx.currentTime + i * 0.1, 0.4, 0.12); });
        };
        return { playBGM, stopBGM, playPoke, playReject, playSuccess };
